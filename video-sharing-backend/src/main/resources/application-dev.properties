# Local development only. Production must supply DB_URL, DB_USERNAME, DB_PASSWORD, and JWT_SECRET.
spring.datasource.url=jdbc:postgresql://localhost:5432/video_sharing
spring.datasource.username=postgres
spring.datasource.password=root

jwt.secret=development-only-secret-change-before-production-32-bytes
auth.cookie.secure=false

#cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

rocketmq.debug.cluster-list.enabled=${ROCKETMQ_DEBUG_CLUSTER_LIST_ENABLED:true}

server.port=0