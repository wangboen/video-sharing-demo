server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Video upload configuration
moderation.lease-duration-minutes=${MODERATION_LEASE_DURATION_MINUTES:15}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# JWT configuration. JWT_SECRET is required unless the explicit dev profile is active.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=7200000

# Redis-backed JWT session configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:16379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}

ADMIN_USERNAME=admin
ADMIN_EMAIL=test@qq.com
ADMIN_PASSWORD=12345678

object-storage.endpoint=${OBJECT_STORAGE_ENDPOINT:http://192.168.50.167:9000}
object-storage.region=${OBJECT_STORAGE_REGION:us-east-1}
object-storage.bucket=${OBJECT_STORAGE_BUCKET:video-sharing}
object-storage.access-key=${OBJECT_STORAGE_ACCESS_KEY:minioadmin}
object-storage.secret-key=${OBJECT_STORAGE_SECRET_KEY:minioadmin}
object-storage.public-base-url=${OBJECT_STORAGE_PUBLIC_BASE_URL:http://192.168.50.167:9000/video-sharing}
object-storage.pending-prefix=${OBJECT_STORAGE_PENDING_PREFIX:pending/}
object-storage.public-prefix=${OBJECT_STORAGE_PUBLIC_PREFIX:public/}
object-storage.presign-expiration-minutes=${OBJECT_STORAGE_PRESIGN_EXPIRATION_MINUTES:15}

video-download.rejected-retention-days=${VIDEO_DOWNLOAD_REJECTED_RETENTION_DAYS:7}
video-download.presign-expiration-minutes=${VIDEO_DOWNLOAD_PRESIGN_EXPIRATION_MINUTES:15}
video-download.rejected-cleanup-cron=${VIDEO_DOWNLOAD_REJECTED_CLEANUP_CRON:0 0 3 * * *}

comments.featured-limit=3
comments.featured-min-likes=10
comments.page-size-default=20
comments.page-size-max=50
comments.max-length=1000
comments.hot-refresh-batch-size=500
comments.hot-cache-ttl-seconds=60

rocketmq.name-server=${ROCKETMQ_NAME_SERVER:127.0.0.1:19876}
rocketmq.producer.group=video-sharing-comment-producer
rocketmq.debug.cluster-list.enabled=${ROCKETMQ_DEBUG_CLUSTER_LIST_ENABLED:false}
rocketmq.debug.cluster-list.timeout-ms=${ROCKETMQ_DEBUG_CLUSTER_LIST_TIMEOUT_MS:1500}
comments.rocketmq.create-topic=comment_create_commands
comments.rocketmq.create-tag=CREATE

spring.data.mongodb.uri=${MONGODB_URI:mongodb://admin:admin@localhost:27017/video_sharing?authSource=admin}
