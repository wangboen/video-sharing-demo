server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/video_sharing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Video upload configuration
file.upload-dir=d:/video-test/uploads
file.thumbnail-dir=d:/video-test/thumbnails
# ??????????????? 10MB?
spring.servlet.multipart.max-file-size=32MB
# ????????????????
spring.servlet.multipart.max-request-size=32MB

# JWT configuration. Set JWT_SECRET to a unique, securely generated value before deployment.
jwt.secret=${JWT_SECRET:development-only-secret-change-before-production-32-bytes}
jwt.expiration-ms=7200000

# Redis-backed JWT session configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
