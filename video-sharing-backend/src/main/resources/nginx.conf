worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 80;
        server_name _;
        client_max_body_size 32m;

        # Build mounts: user frontend dist at this root and staff dist at /staff/.
        location = /staff {
            return 301 /staff/;
        }

        location ^~ /staff/ {
            alias /srv/video-sharing/staff/dist/;
            try_files $uri $uri/ /staff/index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # Only approved public media is directly reachable. Nginx serves byte ranges for static files.
        location /uploads/ {
            alias /srv/video-sharing/public/uploads/;
            autoindex off;
            add_header Cache-Control "public, max-age=31536000";
            add_header Accept-Ranges bytes;
            expires 30d;
        }

        location /thumbnails/ {
            alias /srv/video-sharing/public/thumbnails/;
            autoindex off;
            add_header Cache-Control "public, max-age=31536000";
            expires 30d;
        }

        location ^~ /pending/ {
            return 404;
        }

        location / {
            root /srv/video-sharing/user/dist;
            try_files $uri $uri/ /index.html;
        }
    }
}
