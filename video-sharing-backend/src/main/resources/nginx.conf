
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen 80; # 监听HTTP请求，您可以根据需要改为443并配置SSL

        server_name localhost; # 替换为您的域名或IP地址

        # 前端静态文件（如果Nginx也用于服务前端）
        # root /path/to/your/video-sharing-frontend/dist; # 如果您将前端打包部署到Nginx，需要配置此项
        # index index.html index.htm;

        # 后端API代理配置
        location /api/ {
            proxy_pass http://localhost:8080; # 替换为您的Spring Boot后端实际地址和端口
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 增加超时时间，特别是对于视频上传
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            client_max_body_size 1024M; # 允许最大1GB的上传文件，根据需要调整
        }

        # 视频文件服务配置
        location /uploads/ {
            alias d:/video-test/uploads/; # 替换为您的视频文件实际存储路径
            autoindex off; # 禁止目录列表

            # 优化视频流的响应头
            add_header Cache-Control "public, max-age=31536000"; # 缓存一年
            add_header Accept-Ranges bytes; # 允许范围请求，支持视频拖拽播放
            expires 30d; # 浏览器缓存30天

            # 如果需要更精细的媒体类型处理
            types {
                video/mp4 mp4;
                video/webm webm;
                video/ogg ogv;
            }
        }

        # 缩略图文件服务
        location /thumbnails/ {
            alias d:/video-test/thumbnails/;
            autoindex off;
            add_header Cache-Control "public, max-age=31536000";
            expires 30d;
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/webp webp;
            }
        }


        #listen       80;
        #server_name  localhost;

        #access_log  logs/host.access.log  main;

        #location / {
        #    root   html;
        #    index  index.html index.htm;
        #}

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        #error_page   500 502 503 504  /50x.html;
        #location = /50x.html {
        #    root   html;
        #}

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }


